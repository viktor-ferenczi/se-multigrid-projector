[project]
name = "se-multigrid-projector-tests"
version = "0.1.0"
description = "In game tests of the Multigrid Projector plugin, driven through the Remote plugin"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The dedicated server tests run on their own: uv run pytest tests/ds
norecursedirs = ["ds", "artifacts"]

[tool.uv]
package = false

[tool.black]
target-version = ["py312"]
